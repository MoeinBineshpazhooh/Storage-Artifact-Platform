apiVersion: apps/v1
kind: Deployment
metadata:
  name: rook-ceph-rbd-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rook-ceph-rbd-test
  template:
    metadata:
      labels:
        app: rook-ceph-rbd-test
    spec:
      containers:
        - name: test
          image: busybox:1.36
          command: ["sh", "-c", "exec sleep 86400"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rook-ceph-rbd-test
