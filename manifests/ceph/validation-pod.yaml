# Generic validation workload for a Ceph-backed PVC.
# Prerequisite: a Ceph CSI integration and StorageClass already exist.
apiVersion: v1
kind: Pod
metadata:
  name: ceph-storage-validation
  namespace: default
spec:
  containers:
    - name: validator
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "Ceph storage validation" > /data/health.txt
          sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ceph-test-pvc
