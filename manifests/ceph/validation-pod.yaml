# Generic validation workload for a Ceph-backed PVC.
# Prerequisite: a Ceph CSI integration and StorageClass already exist.
apiVersion: v1
kind: Pod
metadata:
  name: ceph-storage-validation
  namespace: default
spec:
  containers:
    - name: validator
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          if [ ! -e /data/health.txt ]; then
            printf "%s\n" "Ceph storage validation" > /data/health.txt
          fi
          cat /data/health.txt
          exec sleep 86400
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ceph-test-pvc
