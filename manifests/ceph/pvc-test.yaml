# Sanitized Ceph-backed Kubernetes storage validation.
# Prerequisite: Ceph and the Kubernetes CSI integration are already configured.
# Replace `ceph-block` if your environment uses another StorageClass name.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ceph-test-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ceph-storage-test
  namespace: default
spec:
  containers:
    - name: test
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          if [ ! -e /data/health.txt ]; then
            printf "%s\n" "Ceph PVC validation" > /data/health.txt
          fi
          cat /data/health.txt
          exec sleep 86400
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ceph-test-pvc
