# Longhorn consumer-side example.
# Prerequisite: Longhorn is already installed and the CSI driver is healthy.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-fast
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "3"
  staleReplicaTimeout: "30"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-longhorn-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-fast
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhorn-storage-test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: longhorn-storage-test
  template:
    metadata:
      labels:
        app: longhorn-storage-test
    spec:
      containers:
        - name: test
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "Longhorn storage validation" > /data/health.txt
              sleep 3600
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: demo-longhorn-pvc
