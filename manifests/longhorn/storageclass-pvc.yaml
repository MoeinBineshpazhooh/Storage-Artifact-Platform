# Longhorn consumer-side example.
# Prerequisite: Longhorn is already installed and the CSI driver is healthy.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-fast
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "3"
  staleReplicaTimeout: "30"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-longhorn-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-fast
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhorn-storage-test
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: longhorn-storage-test
  template:
    metadata:
      labels:
        app: longhorn-storage-test
    spec:
      containers:
        - name: test
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              if [ ! -e /data/health.txt ]; then
                printf "%s\n" "Longhorn storage validation" > /data/health.txt
              fi
              cat /data/health.txt
              exec sleep 86400
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: demo-longhorn-pvc
