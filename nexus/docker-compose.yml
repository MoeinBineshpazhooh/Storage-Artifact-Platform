services:
  nexus:
    image: ${NEXUS_IMAGE:?Set NEXUS_IMAGE to an approved version or digest}
    container_name: nexus
    ports:
      - "${NEXUS_BIND_ADDRESS:-127.0.0.1}:8081:8081"
    volumes:
      - nexus-data:/nexus-data
    environment:
      INSTALL4J_ADD_VM_PARAMS: >-
        -Xms1200m
        -Xmx1200m
        -XX:MaxDirectMemorySize=2g
        -Djava.util.prefs.userRoot=/nexus-data/javaprefs
    networks:
      - nexus-network

  nginx:
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE to an approved version or digest}
    container_name: nexus-nginx
    ports:
      - "${NEXUS_BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${NEXUS_BIND_ADDRESS:-127.0.0.1}:443:443"
    volumes:
      - ./registry.conf:/etc/nginx/conf.d/registry.conf:ro
      - ./certs:/etc/ssl:ro
    depends_on:
      - nexus
    networks:
      - nexus-network

volumes:
  nexus-data:
    driver: local

networks:
  nexus-network:
    driver: bridge
